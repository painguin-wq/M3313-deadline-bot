services:
  deadline_bot:
    image: deadline-bot:local
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    cpus: "0.25"
    mem_limit: 192m
    mem_reservation: 128m
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./DEADLINES.json:/app/DEADLINES.json
      - ./board-data:/app/board-data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
